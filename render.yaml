services:
  # ─── Web Service (Django + Gunicorn) ───────────────────────
  - type: web
    name: nyar-gi-jack-sound
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt &&
      python manage.py collectstatic --no-input &&
      python manage.py migrate --no-input
    startCommand: gunicorn core.wsgi:application --workers 2 --threads 2 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:


      - key: DJANGO_SETTINGS_MODULE
        value: core.settings.production
      - key: PYTHON_VERSION
        value: 3.13.13  
      - key: DJANGO_SECRET_KEY
        generateValue: true          # Render auto-generates a secure key
      - key: DATABASE_URL
        fromDatabase:
          name: nyar-gi-jack-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: nyar-gi-jack-sound.onrender.com
      - key: MPESA_ENVIRONMENT
        value: sandbox               # Change to 'production' when going live
      - key: MPESA_CONSUMER_KEY
        sync: false                  # Set manually in Render dashboard
      - key: MPESA_CONSUMER_SECRET
        sync: false                  # Set manually in Render dashboard
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        value: https://nyar-gi-jack-sound.onrender.com/payments/callback/
      - key: CORS_ALLOWED_ORIGINS
        value: https://nyar-gi-jack-sound.onrender.com
    healthCheckPath: /               # Render pings this to confirm app is up

  # ─── PostgreSQL Database ────────────────────────────────────
databases:
  - name: nyar-gi-jack-db
    databaseName: nyargijack
    plan: free                       # Free tier: 1GB, perfect for launch
