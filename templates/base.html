<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYAR GI JACK SOUND</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-5 shadow">
        <div class="container">
            <a href="{% url 'store:product_list' %}" class="navbar-brand mb-0 h1 text-decoration-none">NYAR GI JACK SOUND</a>
            
            <div class="d-flex align-items-center">
                
                <form class="d-flex me-4" method="GET" action="{% url 'store:product_list' %}">
                    <input class="form-control rounded-pill rounded-end-0 border-0 ps-3" type="search" name="q" placeholder="Search gear..." value="{{ query|default:'' }}">
                    <button class="btn btn-light rounded-pill rounded-start-0 px-3 fw-bold text-dark border-start-0" type="submit">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                          <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                        </svg>
                    </button>
                </form>
                
                {% if user.is_authenticated %}
                    <span class="text-light fw-bold me-3">Hello, {{ user.username }}!</span>
                    
                    <a class="text-light text-decoration-none fw-bold me-3" href="{% url 'orders:user_orders' %}">My Orders</a>
                    
                    <form action="{% url 'accounts:logout' %}" method="post" class="d-inline me-3">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-danger btn-sm">Logout</button>
                    </form>
                    
                {% else %}
                    <a class="text-light text-decoration-none fw-bold me-3" href="{% url 'accounts:login' %}">Login</a>
                    <a class="btn btn-light btn-sm fw-bold me-3" href="{% url 'accounts:register' %}">Sign Up</a>
                {% endif %}

                <a href="{% url 'cart:cart_summary' %}" class="btn btn-outline-light d-flex align-items-center position-relative">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="me-2" viewBox="0 0 16 16">
                        <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .49.598l-1 5a.5.5 0 0 1-.465.401l-9.397.472L4.415 11H13a.5.5 0 0 1 0 1H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5zM3.102 4l.84 4.479 9.144-.459L13.89 4H3.102zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                    </svg>
                    Cart
                    <span id="cart-qty" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                        {{ cart|length }}
                    </span>
                </a>

            </div>
        </div>
    </nav>

    {% block content %}
    {% endblock %}

</body>
</html>
