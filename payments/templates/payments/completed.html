{% extends 'base.html' %}

{% block content %}
<div class="container mt-5 mb-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-lg border-0 rounded-4 p-5">
                
                <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="#198754" class="bi bi-check-circle-fill mx-auto mb-4" viewBox="0 0 16 16">
                    <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                </svg>

                <h2 class="fw-bold text-dark">Order Received!</h2>
                <h5 class="text-muted mb-4">Order #{{ order.id }}</h5>
                
                <p class="lead">Please check your phone and enter your M-Pesa PIN to complete the transaction.</p>
                <p class="text-muted small mb-5">Once payment is confirmed, we will begin processing your gear for delivery.</p>

                <a href="{% url 'store:product_list' %}" class="btn btn-dark btn-lg fw-bold w-100 rounded-pill">Continue Shopping</a>
                
            </div>
        </div>
    </div>
</div>
{% endblock %}
